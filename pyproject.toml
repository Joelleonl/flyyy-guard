[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flyyy-guard"
version = "0.1.1"
description = "FLYYY prompt-injection guard: blocks malicious prompts before they reach your LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "FLYYY" }]
keywords = ["llm", "prompt-injection", "guardrails", "langchain", "ai-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
langchain = ["langchain>=1.0,<2", "langchain-core>=1.0,<2"]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/flyyy_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
